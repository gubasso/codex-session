# cargo-nextest configuration: profiles for layered testing.
#
# Mirrors the dotfiles template at:
#   ~/.dotfiles/pre-commit/rust.nextest.toml
#
# Output is tuned for token-efficient runs (AI coding agents, CI logs):
# passing tests do not dump stdout/stderr; only failures and the final
# summary appear. Knob meanings (status-level, final-status-level,
# success-output, failure-output) per the upstream config reference:
#   https://nexte.st/docs/configuration/reference/

[profile.default]
status-level = "pass"
final-status-level = "fail"
success-output = "never"
failure-output = "immediate-final"
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2 }

# Unit-test lane. Wired to BOTH `pre-commit` and `pre-push` git stages
# (tier-to-hook mapping per docs-n-notes 08-testing-strategy.md: pre-push
# runs unit + integration, not integration-only).
#
# This crate is binary-only (no [lib]) so unit tests live under
# `kind(bin)`; `kind(lib)` is kept for forward-compatibility if a
# library target is later added.
[profile.pre-commit]
default-filter = "kind(lib) + kind(bin)"
fail-fast = true
slow-timeout = { period = "30s", terminate-after = 2 }
status-level = "fail"
final-status-level = "fail"
success-output = "never"
failure-output = "immediate-final"

# Integration-test lane: tests/*.rs (excluding live tests). Wired to
# the `pre-push` stage.
#
# These are integration tests in the pyramid sense (testing the *seam*
# between the wrapper binary, the config layer, and the child-process
# argv contract). Every test plants a fake `codex` on a curated PATH or
# stubs `CODEX_SESSION_CHILD_BIN`; none invoke a real `codex` binary.
# Per docs-n-notes 08-testing-strategy.md: a wrapper spawning its own
# binary against a stubbed child is integration, not E2E.
#
# Live tests (tests/*_live.rs) are explicitly subtracted via
# `binary(/live/)` — they hit real endpoints and belong in a separate
# tier invoked manually via `just test-live`.
#
# `fail-fast` is off so a single failure does not hide other regressions.
[profile.pre-push]
default-filter = "kind(test) - binary(/live/)"
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 2 }
status-level = "fail"
final-status-level = "fail"
success-output = "never"
failure-output = "immediate-final"

# CI lane: everything, with retry tolerance for known-flaky tests.
#
# `status-level = "fail"` (not "pass"): in CI logs, per-test pass lines
# are noise — they multiply output tokens without adding signal for
# humans triaging a failure or for AI agents parsing the run. The final
# roll-up still surfaces failures via `final-status-level = "fail"`.
# Ref: https://nexte.st/docs/configuration/reference/ (status-level)
#
# Progress bars auto-disable on non-TTY runners (GitHub Actions). If a
# future runner emulates a TTY, set `NEXTEST_HIDE_PROGRESS_BAR=1` in
# the workflow env to suppress redraws — those redraws bloat captured
# logs that agents later read.
# Ref: https://nexte.st/docs/running/
#
# IMPORTANT: this profile is only active when nextest is invoked with
# `--profile ci`. See `.github/workflows/ci.yml`.
[profile.ci]
fail-fast = false
slow-timeout = { period = "180s", terminate-after = 2 }
retries = { backoff = "exponential", count = 2, delay = "1s", max-delay = "10s", jitter = true }
status-level = "fail"
final-status-level = "fail"
success-output = "never"
failure-output = "immediate-final"

# Live API tests: hit real endpoints (WHAM usage, etc.). Selected by
# binary name convention: any test binary matching /live/. Never runs
# in git hooks — the pre-push profile explicitly subtracts binary(/live/).
#
# Requires: real OAuth credentials in the account registry + network.
# Invoke: CODEX_SESSION_LIVE_TESTS=1 just test-live
# See: docs/wham-usage-api-spec.md §7 for re-verification details.
[profile.live]
default-filter = "binary(/live/)"
fail-fast = true
slow-timeout = { period = "30s", terminate-after = 2 }
status-level = "pass"
final-status-level = "fail"
success-output = "immediate"
failure-output = "immediate-final"
