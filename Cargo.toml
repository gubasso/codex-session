[package]
name = "codex-session"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Wrapper around `codex` that composes profile layers into per-terminal session directories."
repository = "https://github.com/gubasso/codex-session"

[[bin]]
name = "codex-session"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-appender = "=0.2.4"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "3"
which = "6"
filetime = "0.2"
figment = { version = "0.10", features = ["env", "toml"] }
toml = { version = "0.8", features = ["preserve_order"] }
directories = "5"
camino = { version = "1", features = ["serde1"] }
libc = "0.2"
rustix = { version = "1", features = ["process", "fs"] }
signal-hook = "0.3"
time = { version = "0.3", features = ["formatting", "parsing"] }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
    "json",
] }
regex = "1"

[dev-dependencies]
assert_cmd = "2"
# We keep the existing `json` feature because the repo's current snapshot
# workflow already relies on it; no Phase 09 migration to `yaml` is needed.
insta = { version = "1", features = ["json"] }
predicates = "3"
tempfile = "3"
filetime = "0.2"
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
