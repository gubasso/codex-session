name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@just
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: nextest
        # `--profile ci` activates the retry-tolerant, quiet-output
        # profile in .config/nextest.toml. Without it nextest falls
        # back to `[profile.default]` and ignores the CI-specific
        # retry/timeout/status-level tuning.
        run: cargo nextest run --profile ci
      - name: print-lint
        run: just lint-print
