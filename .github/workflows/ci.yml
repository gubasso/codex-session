name: ci

# Every step runs in the devshell of flake.nix, so CI and a local run use
# the same toolchain from rust-toolchain.toml and flake.lock, and the same
# clippy. Nix flakes see only git-tracked files, so flake.lock stays
# committed.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Nix cache
        uses: DeterminateSystems/flakehub-cache-action@v3.21.5
      - uses: Swatinem/rust-cache@v2
        with:
          # The cache key holds the output of `rustc -vV`. Run it in the
          # devshell, so the key follows the toolchain of flake.lock and not
          # the rustup toolchain of the runner image.
          cmd-format: nix develop --command {0}
      - name: toolchain
        run: nix develop --command bash -c 'cargo --version && cargo clippy --version'
      - name: fmt
        run: nix develop --command cargo fmt --check
      - name: clippy
        run: nix develop --command cargo clippy --all-targets --all-features -- -D warnings
      - name: nextest
        # `--profile ci` activates the retry-tolerant, quiet-output
        # profile in .config/nextest.toml. Without it nextest falls
        # back to `[profile.default]` and ignores the CI-specific
        # retry/timeout/status-level tuning.
        run: nix develop --command cargo nextest run --profile ci
      - name: print-lint
        run: nix develop --command just lint-print
