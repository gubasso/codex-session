    status: todo
    depends_on: []
    prompt: /prex -ar @.plan/done-plans-fidelity-cleanup/
    notes: >-
      NEXT to execute. Round 01 closes in-repo fidelity gaps found reviewing the
      done plans; round 02 is a read-only cross-repo audit. Touches the other
      plans' _README.md files (divergence addenda).
