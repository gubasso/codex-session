# Git hook configuration for codex-session. The host supplies the hook runner
# prek and the exobrain CLI (host-requirements.toml).
#
# The file copies the common, rust, and nix reference hook sets of
# exobrain-tech, at the tag of the exobrain-tech entry below. The hook
# hook-revisions holds each shared `rev` to that tag, and
# `exobrain hooks sync --to <tag>` moves them. The comment above a hook states
# each project choice that differs from a set.

# The oldest prek that reads this file. `repo: builtin` needs prek.
minimum_prek_version: "0.5.7"
# project: no pre-merge-commit type or stage, because codex-session does not
# integrate with `rk integrate`.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
# A hook with no `stages:` runs at commit. A manifest that declares its own
# `stages:` wins over this line, so each such hook below states its stages.
default_stages: [pre-commit]

# The node hook runs on the devShell nodejs. Without this line, the former
# runner pre-commit picked `default` with an empty cache, and nodeenv failed
# on a prerelease entry of the node index: "invalid literal for int() with
# base 10: '0-alpha'" (2026-11-10).
default_language_version:
  node: system

repos:
  # --- prek built-in hooks ---
  #
  # prek runs these in its own binary: no clone, no environment, and no `rev`.
  # Where a built-in judges less than its upstream hook by default, its
  # arguments restore the upstream behavior
  # (https://prek.j178.dev/0.5.7/reference/built-in-hooks/).
  #
  # The fixers rewrite files, so they skip the generated files: the lock files
  # that cargo and nix write, and the insta snapshots under tests/snapshots/.
  # typos and editorconfig-checker skip the lock files in _typos.toml and
  # .editorconfig-checker.json, so a direct run of either tool agrees.
  #
  # project: no check-symlinks and no check-xml, because the repository tracks
  # no symlink and no XML file, and check-hooks-apply refuses a hook that
  # applies to no file.
  - repo: builtin
    hooks:
      # The upstream manifest declares pre-push too, and the built-in copies it.
      # A fixer never runs at push. The argument keeps a Markdown hard break.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit]
        exclude: '(^|/)(flake|Cargo)\.lock$|\.snap$'
      - id: end-of-file-fixer
        stages: [pre-commit]
        exclude: '(^|/)(flake|Cargo)\.lock$|\.snap$'
      # The default `auto` keeps the most frequent ending of a file, so a file
      # that holds only CRLF passes. `--fix=lf` holds every file to LF.
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '(^|/)(flake|Cargo)\.lock$|\.snap$'
      # 2 MiB, the most common limit of the owned projects.
      - id: check-added-large-files
        args: [--maxkb=2048]
        stages: [pre-commit]
      - id: check-case-conflict
      # Without the argument the hook passes outside a merge or a rebase, so a
      # marker that a resolved conflict left behind lands unseen.
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: destroyed-symlinks
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        stages: [pre-commit]
      # project: exclude Rust sources, because the inner attribute `#![...]` on
      # the first line of a Rust file reads as a shebang.
      - id: check-shebang-scripts-are-executable
        stages: [pre-commit]
        exclude: '\.rs$'
      # prek accepts an unknown tag unless it gets --disallow-unknown-tags. The
      # upstream hook refuses one while it loads the file.
      - id: check-yaml
        args: [--disallow-unknown-tags]
      - id: check-toml
      # check-json5 parses JSON with comments and trailing commas, so it does
      # not refuse a commented .json configuration such as dprint.json or a
      # .jsonc file. `types` resets the filter to every file, and `types_or`
      # selects json, json5, and jsonc.
      - id: check-json5
        types: [file]
        types_or: [json, json5, jsonc]
      - id: detect-private-key
      # project: no set holds this hook. develop is protected, and main and
      # master are refused too, so work happens on a branch.
      - id: no-commit-to-branch
        args: [--branch, develop, --branch, main, --branch, master]

  # --- EditorConfig ---
  #
  # The upstream `language: golang` hook, which prek builds at the pinned rev.
  # It checks what no formatter owns: the charset, the line endings, the
  # trailing whitespace, and the indent style.
  #   - -disable-insert-final-newline: end-of-file-fixer owns it.
  #   - -disable-indent-size: each formatter owns the indentation of its files
  #     (rustfmt, dprint, nixfmt, taplo).
  # Markdown is excluded: the checker flags fenced code and the odd-width
  # continuation of an ordered list, and dprint owns Markdown. The project
  # excludes its generated files in .editorconfig-checker.json, the tool's own
  # configuration, so a direct run skips them too.
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v4.0.2
    hooks:
      - id: editorconfig-checker
        alias: ec
        args: [-disable-insert-final-newline, -disable-indent-size]
        exclude: '\.md$'

  # --- Rust: format and lint ---
  - repo: local
    hooks:
      # A check, not a fix: a hook that rewrites a file leaves the staged copy
      # behind, so `cargo fmt --check` fails and the author formats.
      # owner: devshell (project-environment) cargo fmt is part of the Rust toolchain that the devshell pins.
      - id: cargo-fmt
        name: cargo fmt check
        entry: cargo fmt --check
        language: system
        files: '(\.rs|(^|/)Cargo\.(toml|lock)|^rust-toolchain\.toml)$'
        pass_filenames: false

      # project: no set holds this fixer. It applies the machine-applicable
      # clippy fixes before the gate below judges the code.
      # owner: devshell (project-environment) cargo clippy is part of the Rust toolchain and builds the crate.
      - id: clippy-fix
        name: clippy auto-fix
        entry: cargo clippy --fix --allow-dirty --allow-staged --all-features -- -W clippy::all
        language: system
        types: [rust]
        pass_filenames: false

      # --all-targets lints the tests too, so a lint in a test fails at commit
      # and not first in CI.
      # owner: devshell (project-environment) cargo clippy is part of the Rust toolchain and builds the crate.
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        files: '(\.rs|(^|/)Cargo\.(toml|lock)|^(rust-toolchain|clippy)\.toml)$'
        pass_filenames: false

      # owner: devshell (no-hook-language) upstream taplo publishes no pre-commit hook.
      - id: taplo-format
        name: taplo format
        entry: taplo format
        language: system
        types: [toml]

      # project: the stdout/stderr ownership rule of DEVELOPMENT.md. Only
      # src/ui/, src/error.rs, and src/logging.rs write to the terminal, so a
      # print macro or a direct stdout() or stderr() handle anywhere else in
      # src/ fails. pygrep fails on each line that matches.
      - id: lint-print
        name: stdout/stderr ownership
        language: pygrep
        entry: '(println!|print!|eprint(ln)?!)|(stdout|stderr)\(\)'
        files: '^src/'
        exclude: '^src/(ui/|error\.rs$|logging\.rs$)'
        stages: [pre-commit]

  # --- Markdown formatter: dprint (canonical CommonMark + GFM) ---
  #
  # dprint is the single source of truth for markdown whitespace, list
  # style, emphasis, table padding, etc. Config in ./dprint.json. The devShell
  # supplies dprint. pre-commit only — the format
  # has already been applied by commit time, no need to re-run on push.
  - repo: local
    hooks:
      # owner: devshell (no-hook-language) upstream dprint publishes no pre-commit hook.
      - id: dprint
        name: dprint fmt
        entry: dprint fmt
        language: system
        types: [markdown]
        pass_filenames: true
        stages: [pre-commit]

  # --- Table of contents (updates <!--TOC--> blocks; no-op without markers) ---
  - repo: https://github.com/frnmst/md-toc
    rev: 9.1.0
    hooks:
      - id: md-toc
        # -c: don't gate on TOC list coherence. -p: write in place.
        # --skip-lines 1: don't TOC the H1 title.
        args: [-p, -c, --skip-lines, '1', github]

  # --- Markdown lint (style gate + MD029 ordered-list renumber autofix) ---
  #
  # Runs after dprint. dprint owns all formatting; markdownlint-cli2 gates
  # what dprint can't normalize and autofixes the one thing it can't —
  # ordered-list renumbering (MD029). Fix-mode is isolated to MD029 via
  # "fix": true + per-rule disables in ./.markdownlint-cli2.jsonc.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
        additional_dependencies: ['markdownlint-rule-relative-links']

  # --- Spelling (REPORT-ONLY; config + allowlist in ./_typos.toml) ---
  #
  # No --write-changes by design: typos must never auto-edit source. It
  # only reports — you fix real typos in a normal edit and allowlist false
  # positives in _typos.toml. (With --write-changes it once silently
  # renamed the `Unparseable` variant and the `child_version_unparseable`
  # error-kind string, which is part of the machine-readable error
  # contract.) Snapshot fixtures and the seed allowlist live in _typos.toml.
  - repo: https://github.com/crate-ci/typos
    rev: v1.52.2
    hooks:
      - id: typos
        # The upstream hook passes --write-changes and --force-exclude. These
        # args replace both and keep --force-exclude, so the extend-exclude of
        # _typos.toml still applies to the files that pre-commit passes.
        args: [--force-exclude]
        stages: [pre-commit]

  # --- Tests (layered per docs-n-notes cli-design/08-testing-strategy.md) ---
  #
  # SoT for what gets run. The justfile delegates to these hooks rather
  # than calling cargo directly, so the entry lines below are the only
  # place that defines test commands for this project.
  #
  # Classification follows the general testing pyramid:
  #   - Unit:         src/ inline `#[cfg(test)] mod tests` (115 tests).
  #                   Tests one function/module in isolation. kind=bin
  #                   (this crate is binary-only — no [lib]). Fast (~20 ms).
  #   - Integration:  tests/*.rs excl. *_live.rs (209 tests, kind=test).
  #                   Tests the *seam* between components — wrapper-to-child
  #                   argv contract, config layering, error surfacing,
  #                   --help parity. Every file plants a fake `codex` on a
  #                   curated PATH via `support::TestEnv::make_fake_codex`
  #                   or stubs `CODEX_SESSION_CHILD_BIN`; no test invokes
  #                   the real `codex` binary or any real external system.
  #                   Per the doc: "Integration ≠ touches real things;
  #                   integration = tests the interaction between things."
  #   - Live:         tests/*_live.rs (kind=test, binary matches /live/).
  #                   Hits real API endpoints with real OAuth credentials.
  #                   Still excluded from the integration pre-push lane via
  #                   nextest filter subtraction: pre-push profile uses
  #                   `kind(test) - binary(/live/)`.
  #                   Runs at the `pre-push` git stage via the dedicated
  #                   `cargo-nextest-live` hook (`live` profile; creds +
  #                   network required). `just test-live` delegates to it.
  #                   See docs/wham-usage-api-spec.md §7.
  #
  # Tier-to-hook mapping (matches 08-testing-strategy.md § CI essentials):
  #   - pre-commit: unit only           (sub-second budget)
  #   - pre-push:   unit + integration  (single-digit-seconds budget)
  #   - live:       pre-push            (`cargo-nextest-live` + `just test-live`)
  #
  # Doctests are intentionally omitted: binary-only crate, `cargo test
  # --doc` has nothing to run. Re-add the template's hook if a [lib]
  # target is introduced.
  #
  # Profiles live in `.config/nextest.toml` and pin the filtersets:
  #     [profile.pre-commit] default-filter = "kind(lib) + kind(bin)"
  #     [profile.pre-push]   default-filter = "kind(test) - binary(/live/)"
  #     [profile.live]       default-filter = "binary(/live/)"
  #
  # project: these three tiers take the place of the single cargo-nextest hook
  # of the rust set, because the nextest profiles split the suite by cost and
  # keep the live tests, which need credentials, apart.
  - repo: local
    hooks:
      # owner: devshell (project-environment) cargo nextest runs the test suite of the crate.
      - id: cargo-nextest-unit
        name: cargo nextest (unit tests)
        entry: cargo nextest run --profile pre-commit --all-features
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit, pre-push]

      # owner: devshell (project-environment) cargo nextest runs the test suite of the crate.
      # A test can read any checked-in file, so the suite runs on every push
      # and not only on a change of a Rust file.
      - id: cargo-nextest-integration
        name: cargo nextest (integration tests)
        entry: cargo nextest run --profile pre-push --all-features
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

  - repo: local
    hooks:
      # owner: devshell (project-environment) cargo nextest runs the live tests of the crate.
      - id: cargo-nextest-live
        name: cargo nextest (live API tests)
        entry: env CODEX_SESSION_LIVE_TESTS=1 cargo nextest run --profile live --all-features
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

  # --- Commit message linting (Rust-ecosystem; commit-msg stage) ---
  - repo: https://github.com/crate-ci/committed
    rev: v1.1.12
    hooks:
      - id: committed
        stages: [commit-msg]

  # --- Secret scanning (pre-commit, fast) ---
  - repo: https://github.com/sirwart/ripsecrets
    rev: v0.1.11
    hooks:
      - id: ripsecrets

  # --- Heavy checks (pre-push only) ---
  #
  # The upstream entry scans the staged index, which is empty at a push, so
  # this entry scans the history and passes no file names.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        entry: gitleaks git --redact --verbose --no-banner
        pass_filenames: false
        stages: [pre-push]

  # --- Link checker (pre-push only; network; tuned via ./lychee.toml) ---
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      # The devshell supplies the lychee binary, so the hook installs none.
      # lychee.toml holds every setting. `prek update` moves this rev to the
      # pre-release tag `nightly`. Keep the latest release.
      # owner: devshell (no-hook-language) upstream lychee offers only script, docker_image, and system ids.
      - id: lychee-system
        stages: [pre-push]
        types: [markdown]
        args: [--no-progress]

  # --- Unused dependency detection ---
  - repo: https://github.com/bnjbvr/cargo-machete
    rev: v0.10.1
    hooks:
      - id: cargo-machete
        stages: [pre-push]

  - repo: local
    hooks:
      # cargo deny reads the RustSec database that cargo audit reads, and adds
      # the yanked crates, the bans, the sources, and the licenses, so one
      # policy file, deny.toml, owns all four, and cargo audit stays out.
      # owner: devshell (project-environment) cargo deny is a cargo subcommand that reads the lock file of the workspace.
      - id: cargo-deny
        name: cargo deny
        entry: cargo deny check
        language: system
        files: '((^|/)Cargo\.(toml|lock)|^deny\.toml)$'
        pass_filenames: false
        stages: [pre-push]

  # --- The Nix package (pre-push, costly) ---
  # nix-secrets builds nix/package.nix with its own nixpkgs, so a push that
  # breaks the package breaks the host install. The build reads only the
  # crate, its lock file, VERSION, and the Nix files, so other changes skip it.
  - repo: local
    hooks:
      # owner: host (no-hook-language) nix comes from the host and has no hook in a language that the hook runner builds.
      - id: nix-build
        name: nix build (the package that nix-secrets installs)
        entry: nix build --no-link .#default
        language: system
        pass_filenames: false
        # Follows the fileset of nix/package.nix, plus build.rs, which the
        # fileset must gain when one appears.
        files: '^(src/|nix/|Cargo\.(toml|lock)$|VERSION$|build\.rs$|flake\.(nix|lock)$)'
        stages: [pre-push]

  # --- Nix ---
  #
  # The upstream `language: rust` hook, which prek builds with the cargo of
  # the devshell. Its manifest carries `args: [--fail]` and `types: [nix]`.
  - repo: https://github.com/astro/deadnix
    rev: v1.3.2
    hooks:
      - id: deadnix

  - repo: local
    hooks:
      # The flake publishes nixfmt as its `formatter`, and `nix fmt` and the
      # editors run it outside prek. The hook formats exactly like them, so it
      # runs the nixfmt of the same nixpkgs.
      # owner: devshell (outside-caller) nix fmt runs the nixpkgs nixfmt, so the hook runs the same one.
      - id: nixfmt
        name: nixfmt
        entry: nixfmt
        language: system
        types: [nix]
      # statix walks the tree itself, so the hook passes no file names.
      # owner: devshell (no-hook-language) statix has no hook in a language that prek builds.
      - id: statix
        name: statix
        entry: statix check
        language: system
        types: [nix]
        pass_filenames: false

  # --- A flake holds no language library (pygrep) ---
  - repo: local
    hooks:
      - id: no-language-library-in-flake
        name: a flake holds no language library
        language: pygrep
        entry: '^(?!\s*#).*(withPackages|python3[0-9]*Packages\.|pythonPackages\.|nodePackages\.|perlPackages\.)'
        files: '(^|/)flake\.nix$|(^|/)nix/.*\.nix$'
        stages: [pre-commit]

  # The hooks of exobrain-tech, which call the `exobrain` CLI of the host:
  #   - no-path-flake-reference: a flake reference reads the git tree.
  #   - no-hook-runner-in-flake: a flake holds no git hook runner.
  #   - host-requirements: host-requirements.toml parses.
  #   - hook-revisions: the revisions of the named sets follow the tag.
  - repo: https://github.com/gubasso/exobrain-tech
    rev: v1.2.0
    hooks:
      - id: no-path-flake-reference
      - id: no-hook-runner-in-flake
      - id: host-requirements
      - id: hook-revisions
        args: [--set, common, --set, rust, --set, nix]

  # project: check-hooks-apply, which no set holds, refuses a hook that
  # applies to no file.
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
