# Pre-commit configuration for codex-session.
#
# Tailored from the dotfiles rust template:
#   ~/.dotfiles/pre-commit/rust.pre-commit-config.yaml

default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  # --- Housekeeping (auto-fix where possible) ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: '\.snap$'
      - id: end-of-file-fixer
        exclude: '\.snap$'
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: check-case-conflict
      - id: check-merge-conflict
        args: ['--assume-in-merge']
      - id: check-shebang-scripts-are-executable
        exclude: '\.rs$'
      - id: check-toml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, develop, --branch, main, --branch, master]

  # --- EditorConfig ---
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v3.6.1
    hooks:
      - id: editorconfig-checker
        alias: ec
        args: [-disable-insert-final-newline, '-exclude', 'LICENSE']
        # Markdown is owned by dprint + markdownlint-cli2. editorconfig-checker
        # can't parse markdown (it flags code-fence interiors and the odd-width
        # ordered-list continuations dprint emits, and defaults to indent_size=4
        # even when unset), so it must not police .md. eol / final-newline /
        # trailing-whitespace for markdown are covered by dprint and the
        # pre-commit-hooks end-of-file-fixer / trailing-whitespace hooks.
        exclude: '\.md$'

  # --- Rust: format & lint (auto-fix) ---
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false

      - id: clippy-fix
        name: clippy auto-fix
        entry: cargo clippy --fix --allow-dirty --allow-staged --all-features -- -W clippy::all
        language: system
        types: [rust]
        pass_filenames: false

      - id: clippy-strict
        name: clippy gate
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      # Requires `taplo` on PATH (cargo install taplo-cli --features lsp).
      - id: taplo-format
        name: taplo format
        entry: taplo format
        language: system
        types: [toml]

  # --- Markdown formatter: dprint (canonical CommonMark + GFM) ---
  #
  # dprint is the single source of truth for markdown whitespace, list
  # style, emphasis, table padding, etc. Config in ./dprint.json. Requires
  # `dprint` on PATH (cargo install dprint). pre-commit only — the format
  # has already been applied by commit time, no need to re-run on push.
  - repo: local
    hooks:
      - id: dprint
        name: dprint fmt
        entry: dprint fmt
        language: system
        types: [markdown]
        pass_filenames: true
        stages: [pre-commit]

  # --- Table of contents (updates <!--TOC--> blocks; no-op without markers) ---
  - repo: https://github.com/frnmst/md-toc
    rev: 9.0.0
    hooks:
      - id: md-toc
        # -c: don't gate on TOC list coherence. -p: write in place.
        # --skip-lines 1: don't TOC the H1 title.
        args: [-p, -c, --skip-lines, '1', github]

  # --- Markdown lint (style gate + MD029 ordered-list renumber autofix) ---
  #
  # Runs after dprint. dprint owns all formatting; markdownlint-cli2 gates
  # what dprint can't normalize and autofixes the one thing it can't —
  # ordered-list renumbering (MD029). Fix-mode is isolated to MD029 via
  # "fix": true + per-rule disables in ./.markdownlint-cli2.jsonc.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
        additional_dependencies: ['markdownlint-rule-relative-links']

  # --- Spelling (REPORT-ONLY; config + allowlist in ./_typos.toml) ---
  #
  # No --write-changes by design: typos must never auto-edit source. It
  # only reports — you fix real typos in a normal edit and allowlist false
  # positives in _typos.toml. (With --write-changes it once silently
  # renamed the `Unparseable` variant and the `child_version_unparseable`
  # error-kind string, which is part of the machine-readable error
  # contract.) Snapshot fixtures and the seed allowlist live in _typos.toml.
  - repo: https://github.com/crate-ci/typos
    rev: v1.46.2
    hooks:
      - id: typos

  # --- Tests (layered per docs-n-notes cli-design/08-testing-strategy.md) ---
  #
  # SoT for what gets run. The justfile delegates to these hooks rather
  # than calling cargo directly, so the entry lines below are the only
  # place that defines test commands for this project.
  #
  # Classification follows the general testing pyramid:
  #   - Unit:         src/ inline `#[cfg(test)] mod tests` (115 tests).
  #                   Tests one function/module in isolation. kind=bin
  #                   (this crate is binary-only — no [lib]). Fast (~20 ms).
  #   - Integration:  tests/*.rs excl. *_live.rs (209 tests, kind=test).
  #                   Tests the *seam* between components — wrapper-to-child
  #                   argv contract, config layering, error surfacing,
  #                   --help parity. Every file plants a fake `codex` on a
  #                   curated PATH via `support::TestEnv::make_fake_codex`
  #                   or stubs `CODEX_SESSION_CHILD_BIN`; no test invokes
  #                   the real `codex` binary or any real external system.
  #                   Per the doc: "Integration ≠ touches real things;
  #                   integration = tests the interaction between things."
  #   - Live:         tests/*_live.rs (kind=test, binary matches /live/).
  #                   Hits real API endpoints with real OAuth credentials.
  #                   Still excluded from the integration pre-push lane via
  #                   nextest filter subtraction: pre-push profile uses
  #                   `kind(test) - binary(/live/)`.
  #                   Runs at the `pre-push` git stage via the dedicated
  #                   `cargo-nextest-live` hook (`live` profile; creds +
  #                   network required). `just test-live` delegates to it.
  #                   See docs/wham-usage-api-spec.md §7.
  #
  # Tier-to-hook mapping (matches 08-testing-strategy.md § CI essentials):
  #   - pre-commit: unit only           (sub-second budget)
  #   - pre-push:   unit + integration  (single-digit-seconds budget)
  #   - live:       pre-push            (`cargo-nextest-live` + `just test-live`)
  #
  # Doctests are intentionally omitted: binary-only crate, `cargo test
  # --doc` has nothing to run. Re-add the template's hook if a [lib]
  # target is introduced.
  #
  # Profiles live in `.config/nextest.toml` and pin the filtersets:
  #     [profile.pre-commit] default-filter = "kind(lib) + kind(bin)"
  #     [profile.pre-push]   default-filter = "kind(test) - binary(/live/)"
  #     [profile.live]       default-filter = "binary(/live/)"
  #
  # Requires `cargo nextest` on PATH (cargo install --locked cargo-nextest).
  - repo: local
    hooks:
      - id: cargo-nextest-unit
        name: cargo nextest (unit tests)
        entry: cargo nextest run --profile pre-commit --all-features
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: cargo-nextest-integration
        name: cargo nextest (integration tests)
        entry: cargo nextest run --profile pre-push --all-features
        language: system
        types_or: [rust, toml]
        pass_filenames: false
        stages: [pre-push]

  - repo: local
    hooks:
      - id: cargo-nextest-live
        name: cargo nextest (live API tests)
        entry: env CODEX_SESSION_LIVE_TESTS=1 cargo nextest run --profile live --all-features
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]

  # --- Commit message linting (Rust-ecosystem; commit-msg stage) ---
  - repo: https://github.com/crate-ci/committed
    rev: v1.1.11
    hooks:
      - id: committed
        stages: [commit-msg]

  # --- Secret scanning (pre-commit, fast) ---
  - repo: https://github.com/sirwart/ripsecrets
    rev: v0.1.11
    hooks:
      - id: ripsecrets

  # --- Heavy checks (pre-push only) ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        entry: gitleaks git --redact --verbose
        pass_filenames: false
        stages: [pre-push]

  # --- Link checker (pre-push only; network; tuned via ./lychee.toml) ---
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee
        stages: [pre-push]
        types: [markdown]
        # Args intentionally minimal so lychee.toml owns the behavior.
        args:
          - --no-progress

  # --- Unused dependency detection ---
  - repo: https://github.com/bnjbvr/cargo-machete
    rev: v0.9.2
    hooks:
      - id: cargo-machete
        stages: [pre-push]

  - repo: local
    hooks:
      # Requires `cargo-audit` on PATH (cargo install cargo-audit).
      - id: cargo-audit
        name: cargo audit
        entry: cargo audit
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Requires `cargo-deny` on PATH (cargo install cargo-deny).
      - id: cargo-deny
        name: cargo deny
        entry: cargo deny check advisories bans sources
        language: system
        pass_filenames: false
        stages: [pre-push]

  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
