name: ci

# CI repeats the two hook stages of .pre-commit-config.yaml in the devshell
# of flake.nix, so a push that passed its hooks passes CI. CI holds no check
# of its own. The devshell holds the toolchain from rust-toolchain.toml and
# flake.lock, and the tools of the `language: system` hooks. `nix develop`
# keeps the PATH of the runner, so prek and exobrain, the host tools that the
# steps below install, stay on it. Nix flakes see only git-tracked files, so
# flake.lock stays committed.
#
# Each step names its stage and leaves out the hooks of the group
# local-only, which CI cannot run. The comment above each such hook in
# .pre-commit-config.yaml states why, and DEVELOPMENT.md, section "CI",
# repeats each reason. No hook carries the group ci-only, so the job has no
# step for the manual stage: prek refuses a --group that matches no hook.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # gitleaks scans the history at the push stage, so the job fetches all
      # of it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # The hooks of exobrain-tech call the exobrain CLI, which the devshell
      # does not hold. The job installs the CLI of the exobrain-tech tag that
      # .pre-commit-config.yaml pins.
      - name: Install the exobrain CLI of the pinned exobrain-tech tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(yq '.repos[] | select(.repo | test("/exobrain-tech(\.git)?/?$")) | .rev' .pre-commit-config.yaml)
          asset=exobrain-x86_64-unknown-linux-gnu.tar.xz
          gh release download "$tag" --repo gubasso/exobrain-tech --pattern "$asset" --dir "$RUNNER_TEMP"
          gh attestation verify "$RUNNER_TEMP/$asset" --repo gubasso/exobrain-tech
          mkdir -p "$RUNNER_TEMP/exobrain"
          tar -xJf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/exobrain" --strip-components=1
          echo "$RUNNER_TEMP/exobrain" >> "$GITHUB_PATH"
      # The hook runner is a host tool, so the job installs it as a host does,
      # at the version of the host. The action also caches the hook
      # environments of prek between runs.
      - uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
        with:
          install-only: true
          prek-version: "0.5.10"
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Nix cache
        uses: DeterminateSystems/flakehub-cache-action@v3.21.5
      - uses: Swatinem/rust-cache@v2
        with:
          # The cache key holds the output of `rustc -vV`. Run it in the
          # devshell, so the key follows the toolchain of flake.lock and not
          # the rustup toolchain of the runner image.
          cmd-format: nix develop --command {0}
      # A group filter with no --stage also runs the manual hooks, so each
      # step names its stage.
      - name: commit stage
        run: nix develop --command prek run --all-files --stage pre-commit --no-group local-only
      - name: push stage
        run: nix develop --command prek run --all-files --stage pre-push --no-group local-only
