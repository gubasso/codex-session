# Pre-commit configuration for codex-session.
#
# Tailored from the dotfiles rust template:
#   ~/.dotfiles/pre-commit/rust.pre-commit-config.yaml
#
# Repo is mid-migration (branch: 1-rust-migration-migrate-from-bash-to-rust):
# Rust hooks gate src/ and Cargo.toml; bash hooks remain to gate the
# still-shipping bash entrypoint (bin/, lib/, commands/) and bats test suite.

default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  # --- Housekeeping (auto-fix where possible) ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: check-case-conflict
      - id: check-merge-conflict
        args: ['--assume-in-merge']
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, develop, --branch, main, --branch, master]

  # --- EditorConfig ---
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v3.6.1
    hooks:
      - id: editorconfig-checker
        alias: ec
        args: [-disable-insert-final-newline, '-exclude', 'LICENSE']

  # --- Rust: format & lint (auto-fix) ---
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false

      - id: clippy-fix
        name: clippy auto-fix
        entry: cargo clippy --fix --allow-dirty --allow-staged --all-features -- -W clippy::all
        language: system
        types: [rust]
        pass_filenames: false

      - id: clippy-strict
        name: clippy gate
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      # Requires `taplo` on PATH (cargo install taplo-cli --features lsp).
      - id: taplo-format
        name: taplo format
        entry: taplo format
        language: system
        types: [toml]

  # --- Bash: lint & format (migration period) ---
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        args: ["-i", "2", "-ci"]   # 2-space indent, match .editorconfig

  - repo: https://github.com/openstack/bashate
    rev: 2.1.1
    hooks:
      - id: bashate
        # E003/E006: indent/line-length tolerated.
        # E005 not escalated: lib/ and commands/ use .bash extension for
        # sourced libraries, which legitimately have no shebang.
        # E011: false positives on `if ... ; then ... ; fi` single-line idiom.
        args: ["-i", "E003,E006,E011"]
        exclude: ^tests/(.*\.bats|test_helper\.bash)$

  # Requires `shellharden` on PATH (cargo install shellharden).
  - repo: local
    hooks:
      - id: shellharden
        name: shellharden
        language: system
        entry: shellharden --replace
        types: [shell]

  # --- Spell check ---
  - repo: https://github.com/crate-ci/typos
    rev: v1.46.2
    hooks:
      - id: typos

  # --- Commit message linting (Rust-ecosystem; commit-msg stage) ---
  - repo: https://github.com/crate-ci/committed
    rev: v1.1.11
    hooks:
      - id: committed
        stages: [commit-msg]

  # --- Secret scanning (pre-commit, fast) ---
  - repo: https://github.com/sirwart/ripsecrets
    rev: v0.1.11
    hooks:
      - id: ripsecrets

  # --- Heavy checks (pre-push only) ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        entry: gitleaks git --redact --verbose
        pass_filenames: false
        stages: [pre-push]

  # --- Unused dependency detection ---
  - repo: https://github.com/bnjbvr/cargo-machete
    rev: v0.9.2
    hooks:
      - id: cargo-machete
        stages: [pre-push]

  - repo: local
    hooks:
      # Requires `cargo-audit` on PATH (cargo install cargo-audit).
      - id: cargo-audit
        name: cargo audit
        entry: cargo audit
        language: system
        pass_filenames: false
        stages: [pre-push]

      # cargo-deny disabled: no deny.toml yet in this repo. Re-enable after
      # adding deny.toml with at least an `advisories` and `bans` section.
      # Requires `cargo-deny` on PATH (cargo install cargo-deny).
      # - id: cargo-deny
      #   name: cargo deny
      #   entry: cargo deny check advisories bans sources
      #   language: system
      #   pass_filenames: false
      #   stages: [pre-push]

      # --- Bats: end-to-end tests for the bash entrypoint ---
      # Requires `bats` on PATH.
      - id: bats-tests
        name: bats tests
        language: system
        entry: bats tests/codex-session.bats
        pass_filenames: false
        always_run: true

      # Smoke test exercises the installed entrypoint end-to-end.
      - id: smoke
        name: smoke test
        language: system
        entry: bash tests/smoke.sh
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
