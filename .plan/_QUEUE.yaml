# Source of truth for the .plan/ queue. Status & order live HERE, not in paths.
#
# Each entry:
#   item       dir name (multi-round plan) OR "<slug>.md" (single-file plan)
#   status     backlog | todo | doing | done
#   depends_on list of other `item`s that must be `done` first ([] = none)
#   prompt     exact command to execute this plan
#   notes      free-form context
#
# Order: active items appear first, by execution priority; done items last.
# Multi-round plans run via their inner _QUEUE.yaml — `@.plan/<slug>/` makes the
# executor read that inner queue and run the first `todo` round, then stop.

plans:
  # ---- active ----
  - item: transient-spinner-narration
    status: todo
    depends_on: []
    prompt: /prex -ar @.plan/transient-spinner-narration/
    notes: >-
      Make spinner narration fully transient: wipe per-account ✓/✗ marker lines
      before reports print (account quota/health), finish-and-clear single
      spinners (doctor, account add/refresh), update style guide §9b. 1 round (S).

  # ---- backlog (single-file notes, not yet round-split) ----
  - item: full-prex-review-against-canonical.md
    status: backlog
    depends_on: []
    prompt: /prex -ar .plan/full-prex-review-against-canonical.md
    notes: Loose note — full review of the repo against canonical CLI/Rust specs.
  - item: cli-user-guide.md
    status: backlog
    depends_on: []
    prompt: /prex -ar .plan/cli-user-guide.md
    notes: Multi-file user guide under docs/guide/. Not yet round-split.
